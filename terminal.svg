<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 380" width="100%" height="380">
  <defs>
    <style>
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .cursor {
        animation: blink 1.1s infinite;
      }
      .mono-protocol {
        font-family: 'Courier New', 'Lucida Console', 'Fira Code', Monaco, monospace;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 3px;
        fill: #2ecc71;
        opacity: 0.75;
      }
      .mono-headline {
        font-family: 'Consolas', 'Courier New', 'Lucida Console', Monaco, monospace;
        font-weight: 900;
        font-size: 52px;
        letter-spacing: 3.5px;
        fill: #00ff66;
      }
      .mono-sub {
        font-family: 'Courier New', 'Lucida Console', 'Fira Code', Monaco, monospace;
        font-size: 16.5px;
        font-weight: 500;
        letter-spacing: 0.6px;
        fill: #27e36c;
      }
    </style>

    <!-- Scanline Pattern -->
    <pattern id="crt-scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.8" opacity="0.65" />
    </pattern>

    <!-- Phosphor Glow Filter -->
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- CRT Monitor Dark Background -->
  <rect width="100%" height="100%" fill="#040905" rx="6" ry="6" />

  <!-- CRT Scanlines Overlay -->
  <rect width="100%" height="100%" fill="url(#crt-scanlines)" pointer-events="none" rx="6" ry="6" />

  <!-- Subtle Outer Terminal Border -->
  <rect width="99.6%" height="99.2%" x="2" y="2" fill="none" stroke="#0d2813" stroke-width="1.5" rx="6" ry="6" />

  <!-- Protocol Header Line -->
  <text x="45" y="58" class="mono-protocol" filter="url(#glow)">&gt; INITIALIZING SYSTEM PROTOCOLS...</text>

  <!-- Giant Glowing Retro Headline -->
  <text x="45" y="140" class="mono-headline" filter="url(#glow)">JOSIAH SIACHUA</text>
  <text x="45" y="215" class="mono-headline" filter="url(#glow)">SOFTWARE ENGINEER<tspan class="cursor" fill="#00ff66">_</tspan></text>

  <!-- Left Accent Vertical Rule -->
  <line x1="45" y1="262" x2="45" y2="338" stroke="#165b2a" stroke-width="3" />

  <!-- Description / Subtext -->
  <text x="64" y="284" class="mono-sub" filter="url(#glow)">Full-Stack Developer building scalable applications with Java,</text>
  <text x="64" y="310" class="mono-sub" filter="url(#glow)">Spring Boot, and Angular. Transforming manual operational workflows</text>
  <text x="64" y="336" class="mono-sub" filter="url(#glow)">into robust, automated, production-ready software systems.</text>
</svg>
